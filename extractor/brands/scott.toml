name = "Scott"
discovery = "sitemap"
sitemaps = ["https://www.scott-sports.com/es/es/sitemaps/Product-es-EUR-scottb2c_es.xml"]
include = ['/es/es/product/(scott|contessa)-[a-z0-9-]*-bike(-[a-z]+)?$']
exclude = ['-2[04]-|scale-2[04]|contessa-2[04]|roxter|junior|-jr-', 'magnet|bolts']
browser = true            # httpx recibe la página de Incapsula: siempre Chrome real
classify_by_url = false   # categoría por las migas de pan de la propia Scott
categories = [
  ['plasma|triat|contrarreloj|time ?trial', ''],
  ['e-?mtb|e-?mountain|el[ée]ctricas? de monta', 'emtb'],
  ['eride|e-bike|el[ée]ctric', ''],
  ['gravel', 'gravel'],
  ['carretera|road', 'carretera'],
  ['monta[ñn]a|mountain|\bmtb\b|trail|enduro|cross.?country|downhill', 'mtb'],
]
# Tabla con cada valor repetido (mm, mm, in) y cabecera de 2 columnas por talla: se colapsa a una columna en mm.
collapse_unit_columns = true
name_strip = ['^Bicicleta\s+']
exclude_name = '\bcuadro\b|frameset|\bkit\b|junior'
