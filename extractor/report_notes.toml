# Notas por marca que se añaden a reports/diff.md (motivos de bloqueo y decisiones pendientes).
# Clave = nombre exacto de data/brands.csv.

["Decathlon"]
note = "Geometría y altura por talla tomadas de las fotos de la galería de cada ficha (la propia ficha remite a ellas): imágenes identificadas a mano y transcritas con visión (data/vision/decathlon, extraction_method = vision). Acceso con la ventana de Chrome verificada por el usuario (autorizado), 5 s entre páginas (Crawl-delay de robots.txt). Sin bicis de niño, marketplace (otras marcas), ciclocross ni urbanas/trekking. Fichas sin foto de geometría: sin filas."

["Ridley"]
note = "Bloqueada: la tabla de geometría solo tiene filas con letras (A…J, S, R) y la web no publica la leyenda; S/R parecen stack/reach pero no está confirmado por la marca."

["Santa Cruz"]
note = "Altura de la guía de tallas (X-Small, Small…) con la equivalencia XS/SM/MD/LG aprobada por el usuario. V10 publica 3 posiciones de reach y se rechaza."

["Megamo"]
note = "Altura de la FIT GUIDE (X-SMALL…X-LARGE) con equivalencia aprobada por el usuario. Reason/Ryal (MY27) solo publican el dibujo SVG sin valores."

["Lapierre"]
note = "Rechazos por stack/reach no crecientes publicados así en la web (p. ej. Sensium: S 542 > M 530)."

["Pinarello"]
note = "Sin precio en la web. Dogma F rechazada: reach publicado no creciente (540: 396,7 > 560: 393,4)."

["Bianchi"]
note = "Stack/Reach leídos de las filas Y/X de la tabla según el dibujo oficial de cotas (aprobado por el usuario). Tienda italiana en EUR; sin año de modelo."

["Trek"]
