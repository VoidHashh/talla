["Specialized"]
note = "Altura de la guía oficial /es/es/size-guide (pestaña Bikes) por familia; errata '1 78 - 185' (Epic L) corregida a 178 con aprobación del usuario. Sin altura donde la guía no cubre todas las tallas. Rechazos: stack/reach publicados no crecientes (Chisel, Epic)."

["Cube"]
note = "Altura por talla tomada de su calculador oficial (bikesizing.cube.eu), usado como una persona desde la ventana de Chrome del usuario con su autorización expresa aunque su robots.txt lo prohíbe (Disallow: /) y aunque la regla general excluye calculadoras: por familia, alturas 140–210 cm → tallas recomendadas (data/heights/cube.json). Rechazos: reach publicado no creciente (Nuroad, Attain), por eso no queda gravel."
